name: Coverage

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    permissions:
      contents: write # Publish the coverage badge to the image-data branch on master pushes.
    name: PHP ${{ matrix.php-versions }} on ${{ matrix.operating-system }}
    runs-on: ${{ matrix.operating-system }}
    if: "!contains(github.event.head_commit.message, '[ci]')"
    strategy:
      matrix:
        operating-system: ['ubuntu-latest']
        php-versions: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl, sodium, xdebug
          ini-values: error_reporting=-1, display_errors=On
          coverage: xdebug

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Ensure XML file is being loaded
        run: cp phpunit.xml.dist phpunit.xml

      - name: PHPUnit tests with coverage
        run: vendor/bin/phpunit --coverage-clover clover.xml --coverage-html build/coverage-report

      - name: phpunit-coverage-badge
        uses: timkrase/phpunit-coverage-badge@b2cec23f5564ebf1030a6aa5b1e0fcadc5674d79 # v1.2.1
        with:
          coverage_badge_path: .github/output/coverage.svg
          push_badge: false

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          publish_dir: .github/output
          publish_branch: image-data
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
